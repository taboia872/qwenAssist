plugins {
    id 'com.android.application'
}

android {
    compileSdk 35
    namespace 'io.github.qwenassist'
    android.buildFeatures.buildConfig true
    defaultConfig {
        applicationId "io.github.qwenassist"
        minSdk 21
        targetSdk 35
        versionCode 2
        versionName "1.1.0"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // Sign debug builds with a persistent keystore so users can update in-place
    // across CI builds. Without this, the auto-generated debug key changes on
    // every fresh runner and Android refuses the update. Keystore path and
    // passwords come from GitHub Actions env vars injected by the workflow.
    signingConfigs {
        debug {
            def ksPath = System.getenv('KEYSTORE_PATH')
            if (ksPath && new File(ksPath).exists()) {
                storeFile file(ksPath)
                storePassword System.getenv('STORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
            // If env vars are missing (local builds), Gradle falls back to the
            // default debug keystore in ~/.android/debug.keystore.
        }
    }

    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output ->
            def versionName = variant.versionName
            output.outputFileName = "QwenAssist-${versionName}.apk"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        disable "MissingTranslation"
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.webkit:webkit:1.12.1'
}
